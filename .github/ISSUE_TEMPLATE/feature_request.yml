name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're stuck in, not the solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: help
    attributes:
      label: Would you be willing to work on it?
      options:
        - label: I'd be up for implementing this
