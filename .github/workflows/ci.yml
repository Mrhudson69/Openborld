name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS — build, test, package
    # macos-14 still defaults to Swift 5.10; the package needs 6.0+.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # Picked by version sort rather than hardcoded, so a runner image
        # update doesn't silently break the build. No third-party action,
        # which keeps CI's supply chain to GitHub's own.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Portability guard
        run: bash Scripts/check-portability.sh

      - name: Test
        run: swift run openborld-tests

      - name: Assemble the app bundle
        run: bash Scripts/build-app.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: Openborld-macos
          path: build/Openborld.app
          if-no-files-found: error

  linux:
    # A required check: the portable core builds and passes all 56 tests here,
    # so a change that breaks Linux should fail the PR rather than be noticed
    # months later.
    name: Linux — portable core
    runs-on: ubuntu-latest
    # 6.4: 6.1's libswiftObservation.so fails to link with an undefined
    # reference to swift::threading::fatal — a toolchain defect, not ours.
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite headers and python
        # python3 runs the mock cloud server. Without it the eight provider
        # integration tests skip, and those are precisely the ones that
        # exercise corelibs URLSession — the part most likely to differ.
        run: apt-get update && apt-get install -y libsqlite3-dev python3

      - name: Build the portable core
        run: swift build --product openborld-tests

      - name: Test
        run: swift run openborld-tests
