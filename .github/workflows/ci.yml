name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS — build, test, package
    # macos-14 still defaults to Swift 5.10; the package needs 6.0+.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # Picked by version sort rather than hardcoded, so a runner image
        # update doesn't silently break the build. No third-party action,
        # which keeps CI's supply chain to GitHub's own.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Portability guard
        run: bash Scripts/check-portability.sh

      - name: Test
        run: swift run openborld-tests

      - name: Assemble the app bundle
        run: bash Scripts/build-app.sh release

      - uses: actions/upload-artifact@v4
        with:
          name: Openborld-macos
          path: build/Openborld.app
          if-no-files-found: error

  linux:
    # The core is written to be portable but has never been verified on Linux.
    # This job is allowed to fail so it reports the real state instead of
    # blocking every PR — remove continue-on-error once it is green.
    name: Linux — portable core (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    # 6.4: 6.1's libswiftObservation.so fails to link with an undefined
    # reference to swift::threading::fatal — a toolchain defect, not ours.
    container: swift:6.4
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite headers
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Build the portable core
        run: swift build --product openborld-tests

      - name: Test
        run: swift run openborld-tests
